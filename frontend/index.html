<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta property="og:title" content="Dholpur House" />
    <meta property="og:description" content="Search real UPSC Personality Test transcripts, ask questions about them, and practise with an AI interview board." />
    <meta name="theme-color" content="#9c3d2e" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <meta name="description" content="Search real UPSC Personality Test transcripts, ask questions about them, and practise with an AI interview board." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Jost:wght@400;500;600&family=Marcellus&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap" rel="stylesheet" />
    <script>
      // Apply the saved theme (or the system one) before first paint, so the page never flashes.
      try {
        var t = localStorage.getItem('theme')
        if (t === 'dark' || (!t && matchMedia('(prefers-color-scheme: dark)').matches)) document.documentElement.classList.add('dark')
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
