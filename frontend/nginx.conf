server {
    listen 80;
    root /usr/share/nginx/html;

    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        # /api/ask streams server-sent events: don't buffer them.
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
    }

    # Admin upload of a Telegram export (messages.html is a few MB; big channels split into several files)
    location /api/admin/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        client_max_body_size 200m;
        proxy_read_timeout 300s;
    }

    location /health {
        proxy_pass http://backend:8000;
    }

    location / {
        try_files $uri /index.html;
    }
}
