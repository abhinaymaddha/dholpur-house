# The visitor's real address: trust X-Forwarded-For only from the private networks the reverse proxy (Traefik)
# sits on, and take the right-most untrusted entry, which a visitor can't forge. Passed on as X-Real-IP.
set_real_ip_from 10.0.0.0/8;
set_real_ip_from 172.16.0.0/12;
set_real_ip_from 192.168.0.0/16;
real_ip_header X-Forwarded-For;
real_ip_recursive on;

server {
    listen 80;
    root /usr/share/nginx/html;

    location /api/ {
        proxy_pass http://dholpurhouse-backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # /api/ask streams server-sent events: don't buffer them.
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
    }

    # Admin upload of a Telegram export (messages.html is a few MB; big channels split into several files)
    location /api/admin/ {
        proxy_pass http://dholpurhouse-backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        client_max_body_size 200m;
        proxy_read_timeout 300s;
    }

    location /health {
        proxy_pass http://dholpurhouse-backend:8000;
    }

    location / {
        try_files $uri /index.html;
    }
}
