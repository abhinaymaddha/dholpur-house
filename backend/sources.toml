# Current-affairs sources for Interview mode. RSS or Atom feeds only.
#
# Each article is tagged with interview topics by the same rules used for transcripts
# (backend/app/ingest/tags.py, TOPICS). `topics` limits which topics a feed may feed; leave it
# out to let the rules decide. Feeds are re-fetched when older than `refresh_hours`.

refresh_hours = 6
keep_days = 21

[[source]]
name = "The Hindu – International"
url = "https://www.thehindu.com/news/international/feeder/default.rss"
topics = ["International Relations", "Security & Defence", "Economy"]

